<style>
:root {

* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:var(--font); line-height:1.6; }
nav {
  position:sticky; top:0; z-index:100; background:var(--surface);

}
nav a {
  color:var(--text2); text-decoration:none; padding:14px 16px;
  font-size:0.82rem; font-weight:500; white-space:nowrap;
  border-bottom:2px solid transparent; transition:all 0.2s;
}
nav a:hover, nav a.active { color:var(--accent); border-bottom-color:var(--accent); }
main { max-width:1400px; margin:0 auto; padding:32px 24px; }
section { margin-bottom:48px; display:none; }
section.active { display:block; }
h1 { font-size:2.4rem; font-weight:700; margin-bottom:8px; letter-spacing:-0.5px; }
h2 { font-size:1.5rem; font-weight:600; margin:32px 0 16px; color:var(--accent2); }
h3 { font-size:1.1rem; font-weight:600; margin:24px 0 12px; color:var(--text); }
p { color:var(--text2); margin-bottom:12px; }

.card {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:24px; margin-bottom:20px; box-shadow:var(--shadow);
}
.metrics-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:16px; }
.metric {
  background:var(--surface2); border-radius:var(--radius); padding:20px;
  border-left:3px solid var(--accent);
}
.metric .value { font-size:2rem; font-weight:700; color:var(--accent); font-family:var(--font-mono); }
.metric .label { font-size:0.82rem; color:var(--text2); margin-top:4px; }

table {

  border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;

th, td { padding:10px 14px; text-align:left; border-bottom:1px solid var(--border); }
th { background:var(--surface2); color:var(--accent2); font-weight:600; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.5px; }
tr:hover td { background:var(--surface2); }

.chart-wrap { position:relative; width:100%; max-height:400px; margin:16px 0; }
.chart-wrap canvas { width:100% !important; }

.filters { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
.filters input, .filters select {
  background:var(--surface2); border:1px solid var(--border); color:var(--text);

}
.filters input:focus, .filters select:focus { outline:none; border-color:var(--accent); }

.badge {
  display:inline-block; padding:3px 10px; border-radius:20px; font-size:0.72rem;

.badge-green { background:rgba(0,184,148,0.15); color:var(--green); }
.badge-red { background:rgba(225,112,85,0.15); color:var(--red); }
.badge-orange { background:rgba(253,203,110,0.15); color:var(--orange); }
.badge-blue { background:rgba(116,185,255,0.15); color:var(--blue); }

.score-bar { height:8px; border-radius:4px; background:var(--border); margin-top:4px; }
.score-fill { height:8px; border-radius:4px; background:var(--accent); }

.tag { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; background:var(--surface2); border-radius:4px; font-size:0.75rem; color:var(--text2); margin:2px; }
.tag::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--accent2); }

.section-nav-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:16px; margin-top:24px; }
.section-nav-card {

.section-nav-card .title { font-size:1rem; font-weight:600; margin:8px 0 4px; }
.section-nav-card .desc { font-size:0.82rem; color:var(--text2); }

.heatmap-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:8px; }
.heatmap-cell {
  background:var(--surface2); border-radius:6px; padding:12px; text-align:center;

.heatmap-cell.high { background:rgba(0,184,148,0.25); border:1px solid var(--green); }
.heatmap-cell.med { background:rgba(253,203,110,0.15); border:1px solid var(--orange); }
.heatmap-cell.low { background:rgba(225,112,85,0.12); border:1px solid var(--red); }
.heatmap-cell .label { font-weight:600; color:var(--text); }
.heatmap-cell .score { font-size:1.5rem; font-weight:700; font-family:var(--font-mono); }

.two-col { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
@media (max-width:768px) { .two-col { grid-template-columns:1fr; } }

.timeline { position:relative; padding-left:32px; }
.timeline::before { content:''; position:absolute; left:12px; top:0; bottom:0; width:2px; background:var(--border); }
.timeline-item { position:relative; margin-bottom:28px; padding-left:24px; }
.timeline-item::before { content:''; position:absolute; left:-24px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--accent); }
.timeline-item .phase { font-weight:700; color:var(--accent2); }
.timeline-item .desc { font-size:0.85rem; color:var(--text2); margin-top:4px; }

.source-ddg { color:var(--orange); font-size:0.7rem; }
.source-ai { color:var(--blue); font-size:0.7rem; }

.source-dot-ddg { background:var(--orange); }

.progress-bar { height:6px; background:var(--border); border-radius:3px; margin:4px 0; }

function filterTable(tableId, query) {
  const rows = document.querySelectorAll(`#${tableId} tbody tr`);
  rows.forEach(r => {
    const txt = r.textContent.toLowerCase();
    r.style.display = txt.includes(query.toLowerCase()) ? '' : 'none';
  });
}

function filterTop20(geo) {
  document.querySelectorAll('#section9Table tbody tr').forEach(r => {
    if (geo === 'all') r.style.display = '';
    else r.style.display = r.dataset.geo === geo ? '' : 'none';
  });
}

  const rpdAvg = rpdLabels.map(k => rpdCats[k].reduce((a,b)=>a+b,0)/rpdCats[k].length);
  new Chart(document.getElementById('chartRPD'), {
    type:'bar', data:{labels:rpdLabels,datasets:[{label:'Avg RPD ($)',data:rpdAvg,backgroundColor:'#6c5ce7',borderRadius:6}]},
    options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{grid:{color:'#252540'},ticks:{color:'#9090a8'}},x:{grid:{color:'#252540'},ticks:{color:'#9090a8'}}}}
  });
  // Niche scatter
  const nicheChart = new Chart(document.getElementById('chartNicheScatter'), {
    type:'scatter', data:{datasets:[{label:'Niches',data:section3Niches.map(n=>({x:n.demand,y:11-n.competition,label:n.niche.split('(')[0].trim()})),backgroundColor:'#00cec9',pointRadius:8,pointHoverRadius:12}]},
    options:{responsive:true,plugins:{tooltip:{callbacks:{label:ctx=>ctx.raw.label}},legend:{labels:{color:'#e2e2ea'}}},scales:{x:{title:{text:'Demand Strength',display:true,color:'#9090a8'},grid:{color:'#252540'},ticks:{color:'#9090a8'},min:4,max:10},y:{title:{text:'Competition Weakness (inversed)',display:true,color:'#9090a8'},grid:{color:'#252540'},ticks:{color:'#9090a8'}}}}
  });
  // AI chart
  const aiCats = {Easy:0,Medium:0,Hard:0};
  section5AI.forEach(o => { if(o.build.includes('Easy'))aiCats.Easy++; else if(o.build.includes('Hard'))aiCats.Hard++; else aiCats.Medium++; });
  new Chart(document.getElementById('chartAI'), {
    type:'pie', data:{labels:Object.keys(aiCats),datasets:[{data:Object.values(aiCats),backgroundColor:['#00b894','#fdcb6e','#e17055'],borderWidth:0}]},
    options:{responsive:true,plugins:{legend:{labels:{color:'#e2e2ea'}}}}
  });
}

// Init
renderAll();

// Export function
function exportData() {
  const data = {metrics:keyMetrics,section1:section1Data,section2:section2Trends,section3:section3Niches,section4:section4Clones,section5:section5AI,section7:section7Africa,pricing:pricingData,top20:top20Ranked};
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='app-research-data.json'; a.click();
  URL.revokeObjectURL(url);
}
</script>
