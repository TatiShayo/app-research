<style>
:root{--bg:#06060d;--surface:#0d0d1a;--surface2:#151528;--border:#1e1e3a;--text:#e0e0ea;--text2:#8888a4;--accent:#7c5cfc;--accent2:#00e5cc;--green:#00c896;--red:#ff6b6b;--orange:#ffb347;--blue:#5dade2;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;--radius:10px;--shadow:0 4px 32px rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.6}
nav{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav a{color:var(--text2);text-decoration:none;padding:12px 12px;font-size:.78rem;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;transition:.2s}
nav a:hover,nav a.active{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1480px;margin:0 auto;padding:28px 20px}
section{display:none;margin-bottom:40px}
section.active{display:block}
h1{font-size:2.2rem;font-weight:700;margin-bottom:6px;letter-spacing:-.5px}
h2{font-size:1.35rem;font-weight:600;margin:28px 0 14px;color:var(--accent2)}
h3{font-size:1.05rem;font-weight:600;margin:20px 0 10px}
p{color:var(--text2);margin-bottom:10px;font-size:.92rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.metric{background:var(--surface2);border-radius:var(--radius);padding:18px;border-left:3px solid var(--accent)}
.metric .value{font-size:1.8rem;font-weight:700;color:var(--accent);font-family:'SF Mono',Consolas,monospace}
.metric .label{font-size:.78rem;color:var(--text2);margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:.82rem;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--surface2);color:var(--accent2);font-weight:600;font-size:.73rem;text-transform:uppercase;letter-spacing:.4px}
tr:hover td{background:rgba(124,92,252,.06)}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:6px;font-size:.82rem}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--accent)}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.bg{background:rgba(0,200,150,.15);color:var(--green)}.br{background:rgba(255,107,107,.15);color:var(--red)}.bo{background:rgba(255,179,71,.15);color:var(--orange)}.bb{background:rgba(93,173,226,.15);color:var(--blue)}.ba{background:rgba(124,92,252,.15);color:var(--accent)}.bt{background:rgba(0,229,204,.15);color:var(--accent2)}
.score-bar{height:6px;border-radius:3px;background:var(--border);margin-top:2px}.score-fill{height:6px;border-radius:3px}
.chart-wrap{position:relative;width:100%;max-height:380px;margin:12px 0}.chart-wrap canvas{width:100%!important}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:768px){.two-col{grid-template-columns:1fr}}
.conf{display:flex;align-items:center;gap:6px;font-size:.72rem}.conf-dot{width:8px;height:8px;border-radius:50%}.conf-h{background:var(--green)}.conf-m{background:var(--orange)}.conf-l{background:var(--red)}
.comp-panel{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.comp-card{background:var(--surface2);border-radius:var(--radius);padding:16px;border:1px solid var(--border)}
.comp-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,92,252,.3)}
.timeline{position:relative;padding-left:28px}.timeline::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--border)}
.timeline-item{position:relative;margin-bottom:20px;padding-left:22px}.timeline-item::before{content:'';position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.audit-box{background:rgba(255,107,107,.06);border:1px solid var(--red);border-left:3px solid var(--red);border-radius:var(--radius);padding:20px;margin:16px 0}
.audit-box.green{border-color:var(--green);border-left-color:var(--green);background:rgba(0,200,150,.06)}
.source-ddg{color:var(--orange);font-size:.7rem}.source-ai{color:var(--blue);font-size:.7rem}
.gap-tracker{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.gap-item{background:var(--surface2);border-radius:8px;padding:14px;border-left:3px solid var(--red)}.gap-item.fixed{border-left-color:var(--green)}
.build-order{display:flex;gap:8px;overflow-x:auto;padding:12px 0}.bo-phase{min-width:180px;background:var(--surface2);border-radius:8px;padding:14px;text-align:center;border:1px solid var(--border)}.bo-phase .num{font-size:2rem;font-weight:800;color:var(--accent)}
.export-btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.82rem}.export-btn:hover{opacity:.9}
.tag{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;background:var(--surface2);border-radius:4px;font-size:.7rem;color:var(--text2);margin:2px}
</style>
</head>

<section id="audit"><h1>🔬 Gemini Audit — Devil's Advocate Pass</h1>
<div class="audit-box"><h3>⚠️ What Important Categories Are Missing?</h3>
<p><strong>Gaming monetization tools:</strong> The report focuses on productivity/utility but ignores the #1 revenue category (games = 60% of App Store revenue). Tools for indie game devs (analytics, monetization, UA optimization) are underserved.</p>
<p><strong>Hardware-adjacent apps:</strong> Apps that pair with physical devices (IoT, sensors, wearables) — huge growth area, completely absent.</p>
<p><strong>Regulatory/compliance apps:</strong> GDPR, data protection in Africa, KRA tax compliance — growing mandatory market with willingness to pay.</p>
</div>
<div class="audit-box"><h3>⚠️ Assumptions That Need Validation</h3>
<p><strong>Chama digitization demand:</strong> Assumes chama groups want digital tools. Many chamas resist digitization because trust is built on physical meetings and handwritten records. Need to interview 10+ chama treasurers.</p>
<p><strong>M-Pesa API reliability:</strong> Safaricom's Daraja API has known downtime issues and sandbox-to-production delays (2-4 weeks). Build fallback payment methods.</p>
<p><strong>African app spending:</strong> Assumes Kenyans will pay for apps. Reality: most Kenyan Google Play spending is on airtime/data, not apps. Subscription fatigue is real at low income levels.</p>
</div>
<div class="audit-box green"><h3>✅ Single Highest-Confidence Opportunity</h3>
<p><strong>M-Pesa Freelancer Invoicing.</strong> Why: (1) Kenyan freelancers are already invoicing — just manually via WhatsApp PDFs. (2) M-Pesa payment is universal — no behavior change needed. (3) Zero competitors with M-Pesa integration. (4) Low build complexity (3-6 weeks MVP). (5) Clear path to first paying users (Nairobi freelancer WhatsApp groups + LinkedIn). (6) Revenue model validated by Wave/InvoiceSimple global data.</p>
</div>
<div class="audit-box"><h3>⚠️ Highest-Risk Idea</h3>
<p><strong>Smallholder Farm Manager.</strong> Why: (1) Smartphone penetration in rural Kenya is ~30% vs national 55%. (2) Literacy barriers mean complex UI won't work. (3) Farmers have extremely low willingness to pay for software ($0-2/mo max). (4) Content/language requirements are enormous (40+ local languages). (5) Distribution is the hardest problem — how do you reach 33M dispersed farmers? (6) Government/NGO-subsidized competitors may undercut you. This is a 5-10 year play, not a solo dev quick-win.</p>
</div>
</section>
